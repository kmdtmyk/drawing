version: '3'
services:
  app:
    build:
      context: './docker/app'
      args:
        uid: ${APP_UID}
        gid: ${APP_GID}
    environment:
      TZ: Asia/Tokyo
      RAILS_ENV: ${RAILS_ENV}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      RAILS_SERVE_STATIC_FILES: ${RAILS_SERVE_STATIC_FILES}
      RAILS_FORCE_SSL: ${RAILS_FORCE_SSL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - ./vendor/bundle:/usr/local/bundle
    command: bash -c 'rm -f tmp/pids/server.pid; rails s -b 0.0.0.0'
    depends_on:
      - db
    logging:
      options:
        max-size: 10m
        max-file: '10'
    restart: always
  db:
    image: postgres:9.6.8
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      TZ: Asia/Tokyo
    volumes:
      - db:/var/lib/postgresql/data
      - ./backup:/backup
    logging:
      options:
        max-size: 10m
        max-file: '10'
    restart: always
  web:
    image: nginx:1.13.9
    environment:
      TZ: Asia/Tokyo
    ports:
      - '${PUBLISH_WEB_SERVER_PORT}:80'
    volumes:
      - ./nginx:/etc/nginx
      - ./log/nginx:/var/log/nginx
    depends_on:
      - app
    logging:
      options:
        max-size: 10m
        max-file: '10'
    restart: always
volumes:
  db:
