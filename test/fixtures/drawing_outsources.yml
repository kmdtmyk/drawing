<% i = 1 %>
<% (1..1000).each do |index| %>
  <% Faker::Number.between(0, 3).times do %>
    drawing_outsources_<%= i %>:
      drawing: drawing_<%= index %>
      customer: customer_outsource_<%= Faker::Number.between(1, 5) %>
      purchase_price: <%= Faker::Number.between(1, 1000) * 100 %>
    <% i += 1 %>
  <% end %>
<% end %>
